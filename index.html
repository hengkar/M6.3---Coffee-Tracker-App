<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>☕ Coffee Tracker</h1>
            <p class="subtitle">Track your daily coffee consumption</p>
        </header>

        <main>
            <div class="stats-container">
                <div class="stat-card">
                    <h3>Today</h3>
                    <p class="stat-number" id="todayCount">0</p>
                    <p class="stat-label">cups</p>
                </div>
                <div class="stat-card">
                    <h3>This Week</h3>
                    <p class="stat-number" id="weekCount">0</p>
                    <p class="stat-label">cups</p>
                </div>
                <div class="stat-card">
                    <h3>Total</h3>
                    <p class="stat-number" id="totalCount">0</p>
                    <p class="stat-label">cups</p>
                </div>
            </div>

            <div class="add-coffee-section">
                <h2>Add Coffee</h2>
                <div class="coffee-form">
                    <div class="form-group">
                        <label for="coffeeType">Type:</label>
                        <select id="coffeeType">
                            <option value="Espresso">Espresso</option>
                            <option value="Latte">Latte</option>
                            <option value="Cappuccino">Cappuccino</option>
                            <option value="Americano">Americano</option>
                            <option value="Mocha">Mocha</option>
                            <option value="Cold Brew">Cold Brew</option>
                            <option value="Drip Coffee">Drip Coffee</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="coffeeSize">Size:</label>
                        <select id="coffeeSize">
                            <option value="Small">Small</option>
                            <option value="Medium">Medium</option>
                            <option value="Large">Large</option>
                        </select>
                    </div>
                    <button id="addCoffeeBtn" class="btn-primary">Add Coffee</button>
                </div>
            </div>

            <div class="history-section">
                <div class="history-header">
                    <h2>History</h2>
                    <button id="clearHistoryBtn" class="btn-secondary">Clear All</button>
                </div>
                <div id="coffeeList" class="coffee-list">
                    <p class="empty-message">No coffee entries yet. Add your first cup!</p>
                </div>
            </div>
        </main>

        <footer>
            <p>Stay caffeinated! ☕</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
